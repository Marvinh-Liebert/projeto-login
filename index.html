<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <section id="login">
            <div id="imag">
                
            </div>

            <div id="form">
                <h1>Login</h1>
                <p>Seja bem vindo(a)!<br>Faça login para acessar o site.</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <label for="ilogin"></label>
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="login" id="ilogin" placeholder="insira seu e-mail aqui" autocomplete="email" required>
                    </div>
                    <div class="campo">
                        <label for="isenha"></label>
                        <span class="material-symbols-outlined">lock_person</span>
                        <input type="password" name="senha" id="isenha" placeholder="insira sua senha aqui" autocomplete="current-password" required minlength="8" maxlength="15">
                    </div>
                    <input type="submit" value="Entrar">
                    <a href="esqueci.html" class="botao">Esqueci a senha</a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
